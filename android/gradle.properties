org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Kotlin's incremental compiler cannot close its caches when the pub cache
# (C:\Users\...\AppData\Local\Pub\Cache) and this project (D:\...) live on
# different Windows drives - RelocatableFileToPathConverter.relativeTo()
# throws "this and base files have different roots" and the daemon dies with
# "Could not close incremental caches". It recovers via non-incremental
# fallback, but the failure is noisy and wastes build time. Disabling
# incremental compilation makes that fallback the only path: same output,
# no crash. Plugin sources rarely change, so the slowdown is negligible.
kotlin.incremental=false
